apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-eks-inference.name" . }}
  labels:
    {{- include "llm-eks-inference.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "llm-eks-inference.selectorLabels" . | nindent 4 }}
