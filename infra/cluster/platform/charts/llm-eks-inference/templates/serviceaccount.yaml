# The identity half of the EKS Pod Identity association iam.tf creates. The
# association is keyed on namespace and service account name, so this name is
# load bearing: rename it and the init container loses its access to the weights
# bucket with no other symptom than a failing sync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  labels:
    {{- include "llm-eks-inference.labels" . | nindent 4 }}
automountServiceAccountToken: true
