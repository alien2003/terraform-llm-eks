# EC2NodeClass for general-purpose Karpenter nodes.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ .Release.Name }}-general
  labels:
    {{- include "llm-eks-nodepools.labels" . | nindent 4 }}
spec:
  amiSelectorTerms:
    - alias: {{ .Values.amiAlias | quote }}
  {{ include "llm-eks-nodepools.nodeIdentity" . }}
  subnetSelectorTerms:
    - tags:
        {{ .Values.discoveryTagKey }}: {{ .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        {{ .Values.discoveryTagKey }}: {{ .Values.clusterName | quote }}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      rootVolume: true
      ebs:
        volumeSize: {{ .Values.general.volumeSize | quote }}
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  # Every AWS resource Karpenter creates from this class: the instance, its EBS
  # volumes and the launch template. The named template fails the render if any
  # of Project, Stack or ManagedBy is missing.
  tags:
    {{- include "llm-eks-nodepools.tags" . | nindent 4 }}
