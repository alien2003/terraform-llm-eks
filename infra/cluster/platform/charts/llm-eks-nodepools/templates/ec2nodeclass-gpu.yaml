# EC2NodeClass for accelerator nodes.
#
# A separate node class from the general one on purpose. Karpenter resolves an
# `alias` amiSelectorTerm per instance type, so one class would in fact work, but
# the root volume a GPU node needs is three times the general one's: it holds the
# vLLM image and a full copy of the model weights staged out of S3.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ .Release.Name }}-gpu
  labels:
    {{- include "llm-eks-nodepools.labels" . | nindent 4 }}
spec:
  amiSelectorTerms:
    - alias: {{ .Values.amiAlias | quote }}
  {{ include "llm-eks-nodepools.nodeIdentity" . }}
  subnetSelectorTerms:
    - tags:
        {{ .Values.discoveryTagKey }}: {{ .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        {{ .Values.discoveryTagKey }}: {{ .Values.clusterName | quote }}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      rootVolume: true
      ebs:
        volumeSize: {{ .Values.gpu.volumeSize | quote }}
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpTokens: required
    # One hop. The instance itself reaches IMDS; a container that is not on the
    # host network does not. Nothing in this cluster needs IMDS from a container:
    # every pod that talks to AWS gets its credentials from EKS Pod Identity.
    httpPutResponseHopLimit: 1
  # Every AWS resource Karpenter creates from this class: the instance, its EBS
  # volumes and the launch template. The named template fails the render if any
  # of Project, Stack or ManagedBy is missing.
  tags:
    {{- include "llm-eks-nodepools.tags" . | nindent 4 }}
