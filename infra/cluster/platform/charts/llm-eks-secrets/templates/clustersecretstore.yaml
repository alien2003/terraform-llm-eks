# One cluster-scoped store for AWS Secrets Manager.
#
# Cluster-scoped rather than namespaced because the secrets it produces land in
# different namespaces and a SecretStore cannot be referenced across one.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
  labels:
    {{- include "llm-eks-secrets.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region | quote }}
