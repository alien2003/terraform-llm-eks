{{- if .Values.grafana.enabled }}
# The Grafana administrator credentials.
#
# The password exists in exactly one place, an AWS Secrets Manager secret created
# inside a cloud window. This object names it by ARN and lets the controller
# write the Kubernetes Secret the Grafana chart mounts. Nothing here, in
# Terraform state, or in the chart values is the password itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.grafana.secretName }}
  namespace: {{ .Values.grafana.namespace }}
  labels:
    {{- include "llm-eks-secrets.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.grafana.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.storeName }}
  target:
    name: {{ .Values.grafana.secretName }}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: {{ .Values.grafana.userKey }}
      remoteRef:
        key: {{ .Values.grafana.remoteSecretArn | quote }}
        property: {{ .Values.grafana.remoteUserProperty }}
    - secretKey: {{ .Values.grafana.passwordKey }}
      remoteRef:
        key: {{ .Values.grafana.remoteSecretArn | quote }}
        property: {{ .Values.grafana.remotePasswordProperty }}
{{- end }}
