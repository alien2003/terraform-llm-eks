# External Secrets controller.
#
# Values verified against the chart's own values.yaml at version 2.10.0, pulled
# from https://charts.external-secrets.io.
#
# This is how the Grafana administrator password reaches the cluster without ever
# being a literal in this repository or a value in Terraform state: the controller
# reads AWS Secrets Manager with the credentials EKS Pod Identity hands it and
# writes a Kubernetes Secret the Grafana chart mounts by name.

installCRDs: true

serviceAccount:
  create: true
  name: "${service_account}"

# No IRSA annotation. The controller picks up credentials from the environment the
# Pod Identity agent injects, which is the AWS SDK's default chain.

replicaCount: 1

nodeSelector:
  "${system_label_key}": "${system_label_value}"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

webhook:
  replicaCount: 1
  nodeSelector:
    "${system_label_key}": "${system_label_value}"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

certController:
  replicaCount: 1
  nodeSelector:
    "${system_label_key}": "${system_label_value}"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
