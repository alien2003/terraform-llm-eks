# Overrides for the local llm-eks-secrets chart.
#
# Filled by templatefile() in secrets.tf. The ARN is the only thing that crosses
# from AWS into the cluster; the secret's value never does.

storeName: "${store_name}"
region: "${region}"

grafana:
  enabled: true
  namespace: "${monitoring_namespace}"
  secretName: "${grafana_admin_secret_name}"
  userKey: "${grafana_admin_user_key}"
  passwordKey: "${grafana_admin_pass_key}"
  remoteSecretArn: "${grafana_admin_secret_arn}"
